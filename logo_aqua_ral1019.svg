<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- RAL 1019 Graubeige ~ #A48F7A, Aqua-Gel-Stil (Mac OS X 2000) -->
    <linearGradient id="gel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d7863"/>
      <stop offset="0.55" stop-color="#a48f7a"/>
      <stop offset="1" stop-color="#d6c6b2"/>
    </linearGradient>
    <radialGradient id="glowBottom" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#fff4e2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff4e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5244"/>
      <stop offset="0.5" stop-color="#2b251d"/>
      <stop offset="1" stop-color="#4a4034"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfc3b2"/>
    </linearGradient>
    <radialGradient id="ball" cx="40%" cy="28%" r="80%">
      <stop offset="0" stop-color="#7c6f5f"/>
      <stop offset="0.5" stop-color="#2f2820"/>
      <stop offset="1" stop-color="#14100b"/>
    </radialGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="clipBody"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>

  <!-- Körper -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="#3a3025" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#gel)"/>

  <g clip-path="url(#clipBody)">
    <!-- Glow unten (Aqua-Reflexlicht) -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glowBottom)"/>
    <!-- Pinstripes -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="6">
      <path d="M100 130H924M100 166H924M100 202H924M100 238H924M100 274H924M100 310H924M100 346H924M100 382H924M100 418H924M100 454H924M100 490H924M100 526H924M100 562H924M100 598H924M100 634H924M100 670H924M100 706H924M100 742H924M100 778H924M100 814H924M100 850H924M100 886H924"/>
    </g>
  </g>

  <!-- Aqua-Glanzkappe -->
  <g clip-path="url(#clipBody)">
    <path d="M150 112 H874 Q910 112 910 160 V400 Q512 520 114 400 V160 Q114 112 150 112 Z" fill="url(#shine)" opacity="0.65"/>
  </g>

  <!-- Ring + Fadenkreuz (Glasrohr) -->
  <g filter="url(#sh)">
    <circle cx="512" cy="532" r="270" fill="none" stroke="url(#tube)" stroke-width="26"/>
    <circle cx="512" cy="532" r="150" fill="none" stroke="#2f2a22" stroke-opacity="0.6" stroke-width="12"/>
    <g stroke="url(#tube)" stroke-width="26" stroke-linecap="round">
      <path d="M512 215V320M512 744V849M215 532H320M704 532H809"/>
    </g>
  </g>
  <!-- Highlight auf Ring -->
  <path d="M290 420 A245 245 0 0 1 512 287" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>

  <!-- Squad (Gel-Kugeln) -->
  <g filter="url(#sh)">
    <circle cx="380" cy="400" r="34" fill="url(#ball)"/>
    <circle cx="660" cy="430" r="34" fill="url(#ball)"/>
    <circle cx="640" cy="670" r="34" fill="url(#ball)"/>
    <circle cx="370" cy="660" r="34" fill="url(#ball)"/>
  </g>
  <g fill="#fff" fill-opacity="0.75">
    <ellipse cx="372" cy="387" rx="16" ry="9"/>
    <ellipse cx="652" cy="417" rx="16" ry="9"/>
    <ellipse cx="632" cy="657" rx="16" ry="9"/>
    <ellipse cx="362" cy="647" rx="16" ry="9"/>
  </g>

  <!-- Eigener Standort (Gel-Pfeil) -->
  <g filter="url(#sh)">
    <path d="M512 440 L580 620 L512 584 L444 620 Z" fill="url(#arrow)" stroke="#2f2a22" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <path d="M512 462 L512 572 L462 598 Z" fill="#000" fill-opacity="0.1"/>
  <path d="M512 456 L536 520 L512 510 Z" fill="#fff" fill-opacity="0.8"/>

  <!-- Rand -->
  <rect x="103" y="103" width="818" height="818" rx="187" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="#4b3e30" stroke-opacity="0.7" stroke-width="3"/>
</svg>
